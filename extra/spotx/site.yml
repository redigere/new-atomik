---
- name: Setup SpotX on hosts
  hosts: localhost
  become: true
  gather_facts: true

  pre_tasks:
    - name: Detect real user
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/site/get_real_user.fish"
      register: user_result
      changed_when: false
    - name: Set real user fact
      ansible.builtin.set_fact:
        ansible_user_id: "{{ user_result.stdout }}"

  vars:
    spotx_flatpak_id: com.spotify.Client

  tasks:
    - name: Ensure Spotify is installed (flatpak)
      community.general.flatpak:
        name: "{{ spotx_flatpak_id }}"
        remote: flathub
        state: present
        method: user
      become: true
      become_user: "{{ ansible_user_id }}"
      register: spotify_install
      changed_when: spotify_install is changed
      failed_when: false

    - name: Apply SpotX ad-block patch
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/spotx/apply_spotx.fish"
      become: true
      become_user: "{{ ansible_user_id }}"
      changed_when: false
      failed_when: false
