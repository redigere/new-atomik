---
- name: Setup Flatpak environment
  hosts: localhost
  become: false
  gather_facts: true


  pre_tasks:
    - name: Detect real user
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/site/get_real_user.fish"
      register: user_result
      changed_when: false
    - name: Set real user fact
      ansible.builtin.set_fact:
        ansible_user_id: "{{ user_result.stdout }}"

  vars:
    flatpak_remotes:
      - name: flathub
        url: https://dl.flathub.org/repo/flathub.flatpakrepo
        state: present
    atomik_flatpaks:
      - com.spotify.Client
      - org.kde.Kile
      - org.videolan.VLC

      - com.usebottles.bottles
      - eu.betterbird.Betterbird
      - com.github.wwmm.easyeffects
    atomik_electron_flatpaks:
      - com.spotify.Client

  tasks:
    - name: Skip in containers
      when: >
        ansible_facts.get('virtualization_type', '') == 'container' or
        ansible_facts.get('file', {}).get('/run/.toolboxenv', {}).get('exists', false)
      block:
        - name: Skip message
          ansible.builtin.debug:
            msg: "Skipping flatpak setup in container environment"
        - name: End play
          ansible.builtin.meta: end_play

    - name: Ensure flatpak is installed
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/flatpak/site/ensure_flatpak_installed.fish"
      register: flatpak_install
      changed_when: "'Queued' in flatpak_install.stdout"
      failed_when: false

    - name: Apply live changes if needed
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/flatpak/site/apply_flatpak_live.fish"
      register: apply_flatpak
      changed_when: apply_flatpak.rc == 0
      failed_when: false
      when: flatpak_install.changed

    - name: Ensure Flatpak remotes
      community.general.flatpak_remote:
        name: "{{ item.name }}"
        flatpakrepo_url: "{{ item.url }}"
        state: "{{ item.state }}"
        method: user
      loop: "{{ flatpak_remotes }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: remote_result
      changed_when: remote_result is changed
      failed_when: false

    - name: Install Atomik Flatpaks
      community.general.flatpak:
        name: "{{ item }}"
        remote: flathub
        state: present
        method: user
      loop: "{{ atomik_flatpaks }}"
      loop_control:
        label: "{{ item }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: flatpak_app_install
      changed_when: flatpak_app_install is changed
      failed_when: false

    - name: Apply Electron overrides for Electron-based Flatpaks
      ansible.builtin.shell: |
        OVERRIDE_CMD="flatpak override --user"
        {% for s in atomik_electron_overrides.sockets | default([]) %}
        OVERRIDE_CMD="$OVERRIDE_CMD --socket={{ s }}"
        {% endfor %}
        {% for env_key, env_val in atomik_electron_overrides.env | default({}) | dict2items %}
        OVERRIDE_CMD="$OVERRIDE_CMD --env={{ env_key }}={{ env_val }}"
        {% endfor %}
        $OVERRIDE_CMD {{ item }}
      loop: "{{ atomik_electron_flatpaks }}"
      loop_control:
        label: "{{ item }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: electron_override_result
      changed_when: electron_override_result.rc == 0
      failed_when: false
