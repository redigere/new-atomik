---
- name: Apply GNOME desktop settings
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/desktop/tasks/gnome/apply_gnome_settings.fish"
  become: true
  become_user: "{{ atomik_user }}"
  changed_when: false
  failed_when: false

- name: Create GNOME environment config directory
  ansible.builtin.file:
    path: "/home/{{ atomik_user }}/.config/environment.d"
    state: directory
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0755"
  become: true

- name: Deploy GNOME environment config
  ansible.builtin.copy:
    content: "{{ atomik_gnome_environment }}"
    dest: "/home/{{ atomik_user }}/.config/environment.d/atomik-gnome.conf"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Apply full dconf settings
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/desktop/tasks/gnome/apply_dconf_setting.fish {{ item.path }} {{ item.value }}"
  become: true
  become_user: "{{ atomik_user }}"
  loop: "{{ atomik_gnome_dconf_full }}"
  loop_control:
    label: "{{ item.path }}"
  register: dconf_result
  changed_when: dconf_result.rc == 0
  failed_when: false

- name: Terminal opens in current working directory
  ansible.builtin.shell: "dconf reset /org/gnome/terminal/legacy/profiles:/:default/working-directory"
  become: true
  become_user: "{{ atomik_user }}"
  changed_when: false
  failed_when: false
