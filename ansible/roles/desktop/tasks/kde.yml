---
- name: Detect KDE config tool
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/desktop/tasks/kde/detect_kde_config_tool.fish"
  become: true
  become_user: "{{ atomik_user }}"
  register: kwriteconfig_result
  changed_when: false

- name: Set KDE config tool
  ansible.builtin.set_fact:
    kde_config_tool: "{{ kwriteconfig_result.stdout }}"

- name: Detect display refresh rate
  ansible.builtin.shell: |
    # Try wlr-randr (Wayland), then xrandr (X11)
    if command -v wlr-randr >/dev/null 2>&1; then
      hz=$(wlr-randr 2>/dev/null | grep -oP '\d+\.\d+ Hz' | head -1 | grep -oP '\d+' | head -1)
    elif command -v xrandr >/dev/null 2>&1; then
      hz=$(xrandr 2>/dev/null | grep ' connected' | grep -oP '\d+\.\d+\*' | head -1 | grep -oP '\d+' | head -1)
    fi
    echo "${hz:-60}"
  become: true
  become_user: "{{ atomik_user }}"
  register: display_hz_result
  changed_when: false
  failed_when: false

- name: Set display refresh rate fact
  ansible.builtin.set_fact:
    atomik_display_hz: "{{ [display_hz_result.stdout | int, 60] | max }}"

- name: Apply KDE settings
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/desktop/tasks/kde/apply_kde_setting.fish {{ item.file }} {{ item.group }} {{ item.key }} {{ item.value | default('') }}"
  environment:
    KDE_CONFIG_TOOL: "{{ kde_config_tool }}"
  become: true
  become_user: "{{ atomik_user }}"
  loop: >-
    {{ atomik_kde_settings.animations | default([]) +
       atomik_kde_settings.baloo | default([]) +
       atomik_kde_settings.power | default([]) +
       atomik_kde_settings.taskbar | default([]) +
       atomik_kde_settings.telemetry | default([]) +
       atomik_kde_settings.wallet | default([]) +
       atomik_kde_settings.restrictions | default([]) +
       [{'file': 'kwinrc', 'group': 'Compositing', 'key': 'Backend', 'value': 'OpenGL'},
        {'file': 'kwinrc', 'group': 'Compositing', 'key': 'MaxFps', 'value': atomik_display_hz | string},
        {'file': 'kwinrc', 'group': 'Compositing', 'key': 'VSync', 'value': 'auto'},
        {'file': 'kwinrc', 'group': 'Compositing', 'key': 'Enabled', 'value': 'true'}] +
       atomik_kde_settings.notifications | default([]) +
       atomik_kde_settings.effects | default([]) +
       atomik_kde_settings.kded | default([]) +
       atomik_kde_settings.lock | default([]) +
       atomik_kde_settings.screen_edges | default([]) }}
  loop_control:
    label: "{{ item.file }}/{{ item.group }}/{{ item.key }}"
  when: item.value is defined and kde_config_tool != 'none'

- name: Remove obsolete KDE animation keys
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/desktop/tasks/kde/remove_obsolete_kde_keys.fish"
  environment:
    KDE_CONFIG_TOOL: "{{ kde_config_tool }}"
  become: true
  become_user: "{{ atomik_user }}"
  when: kde_config_tool != 'none'

- name: Deploy KDE power profiles
  ansible.builtin.copy:
    content: "{{ atomik_kde_powerdevil }}"
    dest: "/home/{{ atomik_user }}/.config/powerdevilrc"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Disable unwanted KDE autostart entries
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Hidden=true
    dest: "/home/{{ atomik_user }}/.config/autostart/{{ item }}"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  loop: "{{ atomik_kde_disabled_autostart | default([]) }}"
  loop_control:
    label: "{{ item }}"
  become: true

- name: Mask crashing X11 legacy daemon user units
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/desktop/tasks/kde/mask_x11_legacy_units.fish"
  environment:
    ATOMIK_USER: "{{ atomik_user }}"
  become: true
  changed_when: false

- name: Create KDE environment config directory
  ansible.builtin.file:
    path: "/home/{{ atomik_user }}/.config/environment.d"
    state: directory
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0755"
  become: true

- name: Deploy KDE environment config
  ansible.builtin.copy:
    content: "{{ atomik_kde_environment }}"
    dest: "/home/{{ atomik_user }}/.config/environment.d/atomik-kde.conf"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Deploy KDE panel setup script
  ansible.builtin.copy:
    src: panels.py
    dest: /tmp/kde_panels.py
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Run KDE panel setup
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/desktop/tasks/kde/run_kde_panel_setup.fish"
  become: true
  become_user: "{{ atomik_user }}"
  register: panel_result
  changed_when: panel_result.rc == 0
  failed_when: false

- name: Terminal opens in current working directory
  ansible.builtin.shell: |
    PROFILE=$(kreadconfig6 --file konsolerc --group "Desktop Entry" --key DefaultProfile 2>/dev/null)
    if [ -n "$PROFILE" ]; then
      PF="$HOME/.local/share/konsole/$PROFILE"
      [ -f "$PF" ] && sed -i '/^Directory=/d' "$PF"
    fi
  become: true
  become_user: "{{ atomik_user }}"
  changed_when: false
  failed_when: false
